<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Session Sign-up</title>
  <style>
    :root {
      --desk: #e6ecf2;
      --sheet: #ffffff;
      --ink: #1f3a5f;
      --rule: #c9d6e3;
      --margin-line: #e3a0a0;
      --highlight: #fff1a8;
      --error: #a1281f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--desk);
      color: var(--ink);
      font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .sheet {
      width: 100%;
      max-width: 620px;
      background: var(--sheet);
      border-left: 3px solid var(--margin-line);
      padding: 32px 36px 36px;
      box-shadow: 0 2px 0 var(--rule);
    }
    h1 { font-size: 34px; line-height: 1.15; margin: 0 0 4px; }
    .sub { margin: 0 0 24px; color: #4a6283; }
    form { display: grid; gap: 14px; margin-bottom: 28px; }
    label { font-weight: 600; display: grid; gap: 4px; }
    input {
      font: inherit;
      color: var(--ink);
      padding: 10px 12px;
      border: 2px solid var(--rule);
      border-radius: 4px;
    }
    input:focus { outline: 3px solid var(--highlight); border-color: var(--ink); }
    button {
      justify-self: start;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--ink);
      border: 0;
      border-radius: 4px;
      padding: 10px 22px;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--highlight); outline-offset: 2px; }
    .note { padding: 10px 14px; margin: 0 0 20px; font-weight: 600; }
    .note.ok { background: var(--highlight); }
    .note.error { color: var(--error); border-left: 4px solid var(--error); background: #fbeceb; }
    h2 { font-size: 20px; margin: 0 0 8px; }
    ol { margin: 0; padding: 0; list-style: none; }
    li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
      border-bottom: 1px solid var(--rule);
    }
    li.empty { color: #4a6283; }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>Study Session Sign-up</h1>
    <p class="sub">Thursday review session. Add your name and the topic you want help with.</p>

    {{NOTE}}

    <form method="post" action="/signup">
      <label>Your name
        <input type="text" name="attendee" autocomplete="off">
      </label>
      <label>Topic you want help with
        <input type="text" name="topic" autocomplete="off">
      </label>
      <button type="submit">Sign up</button>
    </form>

    <h2>Signed up ({{COUNT}})</h2>
    <ol>{{SIGNUPS}}</ol>
  </main>
</body>
</html>
